<!DOCTYPE html>
<html lang="en">
<head>

<title>Two Trees Cleaning — Quote Calculator</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #f5f3ee; -webkit-font-smoothing: antialiased; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const e = React.createElement;
const { useState, useMemo, useCallback } = React;

const DEFAULT_CONFIG = {
  base: 115,
  sqftTiers: [
    { upTo: 1000, rate: 0.030 },
    { upTo: 2000, rate: 0.060 },
    { upTo: 3000, rate: 0.048 },
    { upTo: Infinity, rate: 0.035 },
  ],
  bedAdder: 8, bathAdder: 18, petSurcharge: 20,
  freqMults: { weekly: 0.90, biweekly: 1.00, triweekly: 1.08, monthly: 1.15 },
  tierMults: { essential: 1.0, signature: 1.175, deep: 2.75, moveinout: 3.0 },
  addOnPrices: { fridge: 50, fridgeFreezer: 80, oven: 30, laundry: 25, dishes: 25, windowPane: 8, blindSet: 40, shutterSet: 10 },
  deepRangeSpread: 25, normalRangeSpread: 10,
};

const PRICING_LAST_UPDATED = "2026-09-30";

function loadConfigFromURL() {
  try {
    const params = new URLSearchParams(window.location.search);
    const encoded = params.get("cfg");
    if (!encoded) return DEFAULT_CONFIG;
    const d = JSON.parse(atob(encoded));
    return { ...DEFAULT_CONFIG, ...d, freqMults: { ...DEFAULT_CONFIG.freqMults, ...d.freqMults }, tierMults: { ...DEFAULT_CONFIG.tierMults, ...d.tierMults }, addOnPrices: { ...DEFAULT_CONFIG.addOnPrices, ...d.addOnPrices }, sqftTiers: d.sqftTiers || DEFAULT_CONFIG.sqftTiers };
  } catch { return DEFAULT_CONFIG; }
}

function configToURL(config) {
  const encoded = btoa(JSON.stringify(config));
  return window.location.origin + window.location.pathname + "?cfg=" + encoded;
}

function calcBase(beds, baths, sqft, hasPets, cfg) {
  let sc = 0, rem = sqft, prev = 0;
  for (const t of cfg.sqftTiers) {
    const ts = Math.min(rem, (t.upTo === Infinity ? rem : t.upTo) - prev);
    if (ts <= 0) break;
    sc += ts * t.rate; rem -= ts; prev = t.upTo;
    if (rem <= 0) break;
  }
  const bc = Math.max(0, beds - 1) * cfg.bedAdder;
  const btc = Math.max(0, baths - 1) * cfg.bathAdder;
  const pc = hasPets ? cfg.petSurcharge : 0;
  return { subtotal: cfg.base + sc + bc + btc + pc, baseVal: cfg.base, sqft: Math.round(sc), beds: bc, baths: btc, pets: pc };
}

const ONE_TIME_TIERS = ["deep", "moveinout"];

function calcQuote(beds, baths, sqft, hasPets, freq, tier, addOns, cfg) {
  const b = calcBase(beds, baths, sqft, hasPets, cfg);
  const tm = cfg.tierMults[tier] || 1.0;
  const fm = ONE_TIME_TIERS.includes(tier) ? 1.0 : (freq === "onetime" ? cfg.freqMults.monthly : (cfg.freqMults[freq] || 1.0));
  let ao = 0;
  if (addOns.fridge) ao += cfg.addOnPrices.fridge;
  if (addOns.fridgeFreezer) ao += cfg.addOnPrices.fridgeFreezer;
  if (addOns.oven) ao += cfg.addOnPrices.oven;
  if (addOns.laundry) ao += cfg.addOnPrices.laundry;
  if (addOns.dishes) ao += cfg.addOnPrices.dishes;
  if (addOns.windows > 0) ao += addOns.windows * cfg.addOnPrices.windowPane;
  if (addOns.blinds > 0) ao += addOns.blinds * cfg.addOnPrices.blindSet;
  if (addOns.shutters > 0) ao += addOns.shutters * cfg.addOnPrices.shutterSet;
  const fp = b.subtotal * tm * fm + ao;
  const r = Math.round(fp / 5) * 5;
  const sp = ONE_TIME_TIERS.includes(tier) ? cfg.deepRangeSpread : cfg.normalRangeSpread;
  return { low: r - sp, mid: r, high: r + sp, addOnTotal: ao, breakdown: { base: b.baseVal, sqft: b.sqft, beds: b.beds, baths: b.baths, pets: b.pets, essentialSubtotal: Math.round(b.subtotal), tierMult: tm, freqMult: fm, tier, addOnTotal: ao } };
}

const TIERS = [{ key: "essential", label: "Essential", desc: "Standard recurring" }, { key: "signature", label: "Signature", desc: "Essential + deep item" }, { key: "deep", label: "Total Deep", desc: "All deep · One-time" }, { key: "moveinout", label: "Move-In/Out", desc: "Empty home · One-time" }];
const TIER_SCRIPTS = {
  essential: "Our standard recurring clean. We handle dusting, vacuuming, mopping, wiping down kitchen and bathroom surfaces, and trash removal — everything you need to keep the home looking great between visits.",
  signature: "Everything in Essential, plus one deep-clean task rotated in every visit — window sills, inside the oven, baseboards, or light fixtures. That way your home gets a deeper level of care built into the regular schedule, instead of waiting for an occasional deep clean.",
  deep: "A one-time clean that combines everything in Essential with all the rotating deep items from Signature — window sills, inside the oven, baseboards, and light fixtures — all done at once. It's our most comprehensive cleaning, completed in a single day.",
  moveinout: "A one-time deep clean for an empty home. We clean every room top to bottom, including inside cabinets, closets, and appliances, so the space is ready for the next tenant or new owner.",
};
const FREQ_OPTIONS = [{ key: "weekly", label: "Weekly", note: "Best value" }, { key: "biweekly", label: "Every 2 Weeks", note: "Most popular" }, { key: "triweekly", label: "Every 3 Weeks", note: "" }, { key: "monthly", label: "Monthly", note: "" }, { key: "onetime", label: "One-Time", note: "" }];
const SQFT_OPTIONS = [{ val: 800, label: "Under 1K" }, { val: 1250, label: "1K–1.5K" }, { val: 1750, label: "1.5K–2K" }, { val: 2250, label: "2K–2.5K" }, { val: 2750, label: "2.5K–3K" }, { val: 3250, label: "3K+" }];
const TC = {
  essential: { accent: "#2d6a4f", bg: "#d8f3dc", hdr: "linear-gradient(135deg,#1a3a2a,#2d5a3f)", sub: "#7bc4a0" },
  signature: { accent: "#7c5e2c", bg: "#fdf3d7", hdr: "linear-gradient(135deg,#3d2c1e,#6b5340)", sub: "#d4a96a" },
  deep: { accent: "#1a5276", bg: "#d4eaf7", hdr: "linear-gradient(135deg,#1a3248,#2a5578)", sub: "#7ab8d9" },
  moveinout: { accent: "#6b3fa0", bg: "#ece0f8", hdr: "linear-gradient(135deg,#2e1f45,#5a3a80)", sub: "#c4a8e8" },
};
const DA = { fridge: false, fridgeFreezer: false, oven: false, laundry: false, dishes: false, windows: 0, blinds: 0, shutters: 0 };

function App() {
  const [cfg, setCfg] = useState(loadConfigFromURL);
  const [showAdmin, setShowAdmin] = useState(false);
  const [tapCount, setTapCount] = useState(0);
  const [tapTimer, setTapTimer] = useState(null);
  const [copied, setCopied] = useState(false);
  const [smsCopied, setSmsCopied] = useState(false);
  const [tier, setTier] = useState("essential");
  const [beds, setBeds] = useState(null);
  const [baths, setBaths] = useState(null);
  const [sqft, setSqft] = useState(null);
  const [pets, setPets] = useState(null);
  const [freq, setFreq] = useState(null);
  const [addOns, setAddOns] = useState({ ...DA });

  const isOneTime = ONE_TIME_TIERS.includes(tier);
  const allSel = beds !== null && baths !== null && sqft !== null && pets !== null && (isOneTime || freq !== null);
  const quote = useMemo(() => allSel ? calcQuote(beds, baths, sqft, pets, freq, tier, addOns, cfg) : null, [beds, baths, sqft, pets, freq, tier, addOns, cfg, allSel]);

  const handleTap = useCallback(() => {
    const nc = tapCount + 1;
    if (tapTimer) clearTimeout(tapTimer);
    if (nc >= 3) { setShowAdmin(p => !p); setTapCount(0); return; }
    setTapCount(nc);
    setTapTimer(setTimeout(() => setTapCount(0), 800));
  }, [tapCount, tapTimer]);

  const reset = () => { setBeds(null); setBaths(null); setSqft(null); setPets(null); setFreq(null); setAddOns({ ...DA }); };
  const togAO = (k) => setAddOns(p => {
    const n = { ...p };
    if (k === "fridge") { n.fridge = !p.fridge; if (n.fridge) n.fridgeFreezer = false; }
    else if (k === "fridgeFreezer") { n.fridgeFreezer = !p.fridgeFreezer; if (n.fridgeFreezer) n.fridge = false; }
    else n[k] = !p[k];
    return n;
  });
  const setQAO = (k, v) => setAddOns(p => ({ ...p, [k]: Math.max(0, parseInt(v) || 0) }));
  const uCfg = (path, val) => setCfg(p => {
    const n = JSON.parse(JSON.stringify(p));
    const ks = path.split("."); let o = n;
    for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]];
    o[ks[ks.length - 1]] = val; return n;
  });
  const buildSmsText = () => {
    const addOnLabels = [];
    if (addOns.fridge) addOnLabels.push("Inside Fridge");
    if (addOns.fridgeFreezer) addOnLabels.push("Fridge + Freezer");
    if (addOns.oven) addOnLabels.push("Oven");
    if (addOns.laundry) addOnLabels.push("Laundry");
    if (addOns.dishes) addOnLabels.push("Dishes");
    if (addOns.windows > 0) addOnLabels.push(addOns.windows + " Window" + (addOns.windows > 1 ? "s" : ""));
    if (addOns.blinds > 0) addOnLabels.push(addOns.blinds + " Blind Set" + (addOns.blinds > 1 ? "s" : ""));
    if (addOns.shutters > 0) addOnLabels.push(addOns.shutters + " Shutter Set" + (addOns.shutters > 1 ? "s" : ""));
    const lines = [
      "Hi! Thanks for chatting with Two Trees Cleaning today. Here's your quote summary:",
      "",
      "Service: " + ti.label + " Clean" + (isOneTime ? " (One-Time)" : " · " + fl(freq)),
      "Home: " + beds + " bed / " + baths + " bath, ~" + sqft.toLocaleString() + " sq ft" + (pets ? ", has pets" : ""),
    ];
    if (addOnLabels.length) lines.push("Add-ons: " + addOnLabels.join(", "));
    lines.push("Estimate: $" + quote.low + "–$" + quote.high + " (starting at $" + quote.mid + ")");
    lines.push("");
    lines.push("Let us know if you'd like to get on the schedule!");
    return lines.join("\n");
  };
  const copySms = async () => {
    const txt = buildSmsText();
    try { await navigator.clipboard.writeText(txt); } catch { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); }
    setSmsCopied(true); setTimeout(() => setSmsCopied(false), 2000);
  };
  const copyLink = async () => {
    const url = configToURL(cfg);
    try { await navigator.clipboard.writeText(url); } catch { const ta = document.createElement("textarea"); ta.value = url; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); }
    setCopied(true); setTimeout(() => setCopied(false), 2000);
  };

  const tc = TC[tier];
  const ti = TIERS.find(t => t.key === tier);
  const fl = (k) => ({ weekly: "Weekly", biweekly: "Biweekly", triweekly: "Every 3 Wks", monthly: "Monthly", onetime: "One-Time" }[k] || k);
  const hasAO = addOns.fridge || addOns.fridgeFreezer || addOns.oven || addOns.laundry || addOns.dishes || addOns.windows > 0 || addOns.blinds > 0 || addOns.shutters > 0;

  return e("div", { style: { minHeight: "100vh", background: "#f5f3ee", fontFamily: "'Segoe UI',system-ui,-apple-system,sans-serif" } },
    e("div", { style: { maxWidth: 460, margin: "0 auto", padding: "0 16px 80px" } },

      // Header
      e("div", { style: { background: tc.hdr, margin: "0 -16px", padding: "32px 24px 28px", borderRadius: "0 0 28px 28px", textAlign: "center", position: "relative", overflow: "hidden", transition: "background 0.4s ease" } },
        e("div", { style: { position: "absolute", top: -30, right: -30, width: 100, height: 100, borderRadius: "50%", background: "rgba(255,255,255,0.06)" } }),

// Helper components
function Sec(label, children) {

function AOT(label, price, active, onClick, tc) {

  const active = value > 0;

    e("div", { style: { fontSize: 13, fontWeight: 600, color: active ? tc.accent : "#3d2c1e" } }, label),

    e("div", { style: { display: "flex", alignItems: "center", justifyContent: "center", gap: 8 } },
      e("button", { onClick: () => onChange(Math.max(0, value - 1)), style: { width: 32, height: 32, borderRadius: 8, border: "1.5px solid #e8e6e1", background: "#fff", fontFamily: "inherit", fontSize: 16, fontWeight: 700, color: "#3d2c1e", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" } }, "−"),
      e("input", { type: "number", value: value, onChange: ev => onChange(ev.target.value), style: { width: 44, height: 32, textAlign: "center", border: "1.5px solid #e8e6e1", borderRadius: 8, fontFamily: "inherit", fontSize: 15, fontWeight: 700, color: "#3d2c1e", outline: "none" } }),
      e("button", { onClick: () => onChange(value + 1), style: { width: 32, height: 32, borderRadius: 8, border: "1.5px solid #e8e6e1", background: "#fff", fontFamily: "inherit", fontSize: 16, fontWeight: 700, color: "#3d2c1e", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" } }, "+")

function AG(label, inputs) {
